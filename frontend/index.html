<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA — оценка диалогов</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <!-- Корневой компонент. Для Dynamics 365 этот контейнер встраивается как HTML web resource;
       вся логика - в js/, без зависимости от Xrm и DOM родительской формы. -->
  <header class="topbar">
    <strong>CQA</strong>
    <nav>
      <a href="#/">Диалоги</a>
      <a href="#/checklist">Чек-лист</a>
      <a href="#/appeals">Апелляции</a>
    </nav>
    <label class="role">Демо-роль:
      <select id="role">
        <option value="operator">Пользователь</option>
        <option value="reviewer">Проверяющий</option>
      </select>
    </label>
    <span id="mode-badge" class="badge"></span>
  </header>
  <main id="app" aria-live="polite"></main>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
