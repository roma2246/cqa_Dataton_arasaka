<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CQA — качество диалогов</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%233656d6'/%3E%3Cpath d='M9 16.5l4.5 4.5L23 11.5' stroke='white' stroke-width='3' fill='none' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
  <script>
    // Тема до отрисовки, чтобы не мигало
    try { const t = localStorage.getItem("cqa-theme"); if (t) document.documentElement.dataset.theme = t; } catch {}
  </script>
</head>
<body>
  <!-- Корневой компонент. Для Dynamics 365 встраивается как HTML web resource;
       логика — в js/, без зависимости от Xrm и DOM родительской формы. -->
  <div class="shell">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">CQA</div>
        <div>
          <div class="brand-name">Качество диалогов</div>
          <div class="brand-sub">Freedom Broker</div>
        </div>
      </div>
      <nav class="nav" aria-label="Разделы">
        <a href="#/" data-route="list">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          <span class="lbl">Диалоги</span>
        </a>
        <a href="#/tasks" data-route="tasks">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
          <span class="lbl">Задачи</span>
          <span class="count" id="tasks-count" hidden style="background:var(--accent-weak);color:var(--accent)"></span>
        </a>
        <a href="#/analytics" data-route="analytics">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 6-6"/></svg>
          <span class="lbl">Аналитика</span>
        </a>
        <a href="#/checklist" data-route="checklist">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
          <span class="lbl">Чек-лист</span>
        </a>
        <a href="#/appeals" data-route="appeals">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l9 4.5v5c0 5-3.8 8.3-9 9.5-5.2-1.2-9-4.5-9-9.5v-5z"/><path d="M12 8v5"/><path d="M12 16h.01"/></svg>
          <span class="lbl">Апелляции</span>
          <span class="count" id="appeals-count" hidden></span>
        </a>
      </nav>
      <div class="sidebar-foot">
        <div>
          <div class="side-label">Демо-роль</div>
          <div class="seg" id="role" role="group" aria-label="Демо-роль">
            <button type="button" data-v="operator" aria-pressed="true">Пользователь</button>
            <button type="button" data-v="reviewer" aria-pressed="false">Проверяющий</button>
          </div>
        </div>
        <span id="mode-badge" class="chip mode-pill">…</span>
        <button class="btn btn-ghost btn-sm" id="theme" type="button" title="Сменить тему" aria-label="Сменить тему">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <span class="lbl">Тема</span>
        </button>
      </div>
    </aside>
    <main class="main">
      <div id="app" class="page" aria-live="polite"></div>
    </main>
  </div>
  <div id="toast" role="status"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
